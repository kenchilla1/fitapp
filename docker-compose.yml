services:
  lift-with-kenny:
    image: ghcr.io/kenchilla1/lift-with-kenny:latest
    container_name: lift-with-kenny
    user: "99:100"
    ports:
      - "4173:4173"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4173"
      REPWISE_DATA_DIR: /data
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - /mnt/user/appdata/origin:/data
    restart: unless-stopped